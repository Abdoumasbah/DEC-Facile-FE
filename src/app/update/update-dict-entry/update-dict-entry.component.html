<form
  [formGroup]="form"
  (ngSubmit)="saveUpdateDictEntry()"
  class="new-dict-wrapper"
>

  <div class="new-dict-card">

    <h2 class="form-title">Update Dictionary Entry</h2>

    <div class="form-row">
    <!-- LABEL -->
    <div class="form-group flex-2">
      <label>
        Label <span class="required">*</span>
      </label>
      <input
        type="text"
        pInputText
        formControlName="label"
        placeholder="Entry label"
      />
    </div>

    <!-- LANGUAGE (READONLY) -->
    <div class="form-group flex-1">
      <label>Language</label>
      <input
        type="text"
        pInputText
        formControlName="language"
        readonly
      />
    </div>
      <!-- POS -->
      <div class="form-group flex-1">
        <label>
          Part of Speech <span class="required">*</span>
        </label>

        <p-multiSelect
          formControlName="pos"
          [options]="posOptions"
          optionLabel="label"
          optionValue="value"
          display="chip"
          [filter]="true"
          [showClear]="true"
          filterMatchMode="startsWith"
          placeholder="Select part of speech"
          styleClass="w-full">
        </p-multiSelect>
      </div>
    </div>


    <!-- TYPE -->

    <div class="form-group">
      <label>
        Entry Type <span class="required">*</span>
      </label>

      <div class="type-select">
        <p-select-button
          formControlName="type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value">
        </p-select-button>
      </div>
    </div>

    <!-- NOTE -->
    <div class="form-group">
      <label>Note</label>
      <div
        #noteField
        contenteditable="true"
        class="note-field"
        (input)="updateNote($event)">
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="form-actions">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text"
        (click)="cancel()">
      </button>
      <button
        pButton
        type="submit"
        label="Update"
        class="p-button-primary">
      </button>
    </div>

  </div>
</form>
