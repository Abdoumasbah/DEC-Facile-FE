<form
  [formGroup]="form"
  (ngSubmit)="saveUpdatedForm()"
  class="new-dict-wrapper"
>
  <div class="new-dict-card">

    <h2 class="form-title">Update Form</h2>

    <!-- LABEL + LANGUAGE -->
    <div class="form-row">
      <div class="form-group flex-2">
        <label>
          Label
        </label>
        <input
          type="text"
          pInputText
          formControlName="label"
          readonly
        />
      </div>

      <div class="form-group flex-1">
        <label>Language</label>
        <input
          type="text"
          pInputText
          formControlName="language"
          readonly
        />
      </div>
      <!-- POS -->
      <div class="form-group flex-1">
        <label>
          Part of Speech <span class="required">*</span>
        </label>

        <!-- READ-ONLY -->
        <input
          *ngIf="!posSelectionRequired"
          type="text"
          pInputText
          [value]="selectedPOSLabel"
          readonly
        />

        <!-- PRIME DROPDOWN (multi-POS case) -->
        <p-dropdown
          *ngIf="posSelectionRequired"
          formControlName="pos"
          [options]="posOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Select part of speech"
          styleClass="w-full">
        </p-dropdown>
      </div>

    </div>



    <!-- TYPE -->
    <div class="form-group">
      <label>
        Type <span class="required">*</span>
      </label>

      <div class="type-select">
        <p-select-button
          formControlName="type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value">
        </p-select-button>
      </div>
    </div>

    <!-- MORPHOLOGICAL FEATURES -->
    <div class="form-group">
      <label class="flex items-center gap-2">
        Morphological features
        <button
          type="button"
          pButton
          icon="pi pi-plus"
          class="p-button-text p-button-sm"
          (click)="addMorphoFeature()">
        </button>
      </label>

      <div
        class="morpho-row"
        *ngFor="let mf of morphoFeatures.controls; let i = index"
        [formGroup]="getMorphoGroup(i)">

        <p-select
          formControlName="property"
          [options]="morphologies"
          optionLabel="propertyLabel"
          placeholder="Select feature"
          (onChange)="onMorphoPropertyChange(i)">
        </p-select>

        <p-select
          formControlName="value"
          [options]="getMorphoValues(i)"
          optionLabel="valueLabel"
          placeholder="Select value">
        </p-select>

        <button
          type="button"
          pButton
          icon="pi pi-trash"
          class="p-button-text p-button-danger"
          (click)="removeMorphoFeature(i)">
        </button>
      </div>
    </div>


    <!-- NOTE -->
    <div class="form-group">
      <label>Note</label>
      <div
        #noteField
        contenteditable="true"
        class="note-field"
        (input)="updateNote($event)">
      </div>
    </div>

    <!-- ACTIONS (NO CANCEL YET) -->
    <div class="form-actions">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text"
        (click)="cancel()">
      </button>
      <button
        pButton
        type="submit"
        label="Update"
        class="p-button-primary">
      </button>
    </div>

  </div>
</form>
