<form [formGroup]="form" (ngSubmit)="saveUpdatedDict()" class="new-dict-wrapper">

  <div class="new-dict-card">

    <h2 class="form-title">Update Dictionary</h2>

    <div class="form-row">
    <!-- Label -->
    <div class="form-group flex-2">
      <label>
        Label <span class="required">*</span>
      </label>
      <input
        type="text"
        pInputText
        formControlName="label"
        placeholder="The canonical form of the dictionary"
      />
    </div>

    <!-- Language (readonly) -->
    <div class="form-group flex-2">
      <label>
        Language
      </label>
      <input
        type="text"
        pInputText
        formControlName="language"
        readonly
      />
    </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description</label>
      <textarea
        pInputTextarea
        rows="3"
        formControlName="description"
        placeholder="Optional description of the dictionary">
      </textarea>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text"
        (click)="cancel()">
      </button>

      <button
        pButton
        type="submit"
        label="Update"
        class="p-button-primary"
        [disabled]="form.invalid">
      </button>
    </div>

  </div>
</form>
